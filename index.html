<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090c"><link rel="manifest" href="manifest.webmanifest"><title>Forma</title><style>
:root{--bg:#08090c;--c:#15171c;--c2:#1d2027;--t:#f7f7f8;--m:#9ca1ad;--l:#292d35;--ok:#70e5a5;--red:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,input{font:inherit}button{border:0;color:inherit;cursor:pointer}.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:94px}header{padding:24px 20px 12px;display:flex;justify-content:space-between;align-items:center}h1{font-size:30px;margin:0;font-weight:800}h2{font-size:22px;margin:8px 0 14px}.muted{color:var(--m)}.screen{display:none;padding:8px 18px}.screen.active{display:block}.hero{background:linear-gradient(145deg,#1b1e26,#101217);border:1px solid var(--l);border-radius:26px;padding:22px;margin:10px 0 18px}.eyebrow{color:var(--m);font-size:12px;font-weight:700;letter-spacing:.7px}.hero strong{display:block;font-size:27px;line-height:1.1;margin:7px 0 18px}.primary{width:100%;background:#f5f5f6;color:#08090c;padding:15px 18px;border-radius:16px;font-weight:750}.secondary{background:var(--c2);padding:11px 14px;border-radius:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:var(--c);border:1px solid var(--l);padding:17px;border-radius:18px}.stat b{font-size:25px;display:block}.stat span{font-size:12px;color:var(--m)}.list{display:flex;flex-direction:column;gap:10px}.row{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:15px}.rowmain{display:flex;justify-content:space-between;align-items:center;gap:10px}.info{min-width:0}.info b{display:block;font-size:16px}.info span{display:block;color:var(--m);font-size:13px;margin-top:4px}.actions{display:flex;gap:7px}.mini{padding:9px 11px;border-radius:11px;background:var(--c2);font-size:13px}.danger{color:var(--red)}.empty{padding:35px 15px;text-align:center;color:var(--m);background:var(--c);border-radius:20px;border:1px dashed var(--l)}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(8,9,12,.94);backdrop-filter:blur(18px);border-top:1px solid var(--l);z-index:10}.bottomin{max-width:560px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.tab{background:none;padding:13px 5px 11px;color:var(--m);font-size:12px}.tab.active{color:#fff}.tab span{display:block;font-size:20px;margin-bottom:3px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;z-index:20}.modal.open{display:flex}.sheet{width:100%;max-width:560px;margin:auto 0 0;background:#111318;border-radius:28px 28px 0 0;max-height:93vh;overflow:auto;padding:20px}.head{display:flex;justify-content:space-between;align-items:center}.close{background:var(--c2);width:36px;height:36px;border-radius:50%}label{display:block;color:var(--m);font-size:13px;margin:13px 0 7px}input{width:100%;background:var(--c);color:#fff;border:1px solid var(--l);padding:13px;border-radius:13px;outline:none}.ex{border:1px solid var(--l);background:var(--c);border-radius:17px;padding:13px;margin:10px 0}.extop{display:flex;gap:8px}.extop input{flex:1}.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}.type{padding:11px;border-radius:12px;background:var(--c2);color:var(--m);font-weight:650}.type.on{background:#f5f5f6;color:#08090c}.fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.runner{position:fixed;inset:0;background:#08090c;z-index:30;display:none}.runner.open{display:block}.rin{height:100%;max-width:560px;margin:auto;display:flex;flex-direction:column;padding:22px 20px calc(25px + env(safe-area-inset-bottom))}.rtop{display:flex;justify-content:space-between;align-items:center}.bar{height:4px;background:#1c1f26;border-radius:5px;margin:17px 0}.bar i{display:block;height:100%;background:#fff;border-radius:5px;width:0}.rmain{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}.phase{color:var(--m);font-size:13px;font-weight:750;letter-spacing:1px}.rmain h2{font-size:38px;line-height:1.05;margin:8px 0 14px}.value{font-size:88px;font-weight:850;letter-spacing:-4px;font-variant-numeric:tabular-nums}.rep{font-size:68px;font-weight:850}.detail{font-size:18px;color:var(--m);margin-top:12px}.hint{font-size:14px;color:var(--m);margin:18px auto 0;max-width:360px}.controls{display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:10px}.controls button{padding:17px;border-radius:17px;background:var(--c2);font-weight:700}.controls .main{background:#f5f5f6;color:#08090c}.confirm{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:40}.confirm.open{display:flex}.cc{width:min(420px,100%);background:var(--c);border:1px solid var(--l);border-radius:24px;padding:20px}.cc p{color:var(--m)}.ca{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#f5f5f6;color:#08090c;padding:11px 15px;border-radius:14px;font-weight:700;opacity:0;z-index:50;transition:.2s}.toast.show{opacity:1}
</style></head><body><div class="app"><header><h1>Forma</h1><div class="muted" id="date"></div></header>
<section id="home" class="screen active"><div class="hero"><div class="eyebrow">TON ESPACE D’ENTRAÎNEMENT</div><strong id="hero">Crée ton premier entraînement.</strong><button class="primary" onclick="editor()">＋ Créer un entraînement</button></div><h2>Cette semaine</h2><div class="grid"><div class="stat"><b id="done">0</b><span>séances terminées</span></div><div class="stat"><b id="mins">0</b><span>minutes</span></div></div></section>
<section id="workouts" class="screen"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Mes entraînements</h2><button class="secondary" onclick="editor()">＋</button></div><div id="list" class="list"></div></section>
<section id="history" class="screen"><h2>Historique</h2><div id="hist" class="list"></div></section></div>
<nav class="bottom"><div class="bottomin"><button class="tab active" data-tab="home"><span>⌂</span>Accueil</button><button class="tab" data-tab="workouts"><span>◉</span>Entraînements</button><button class="tab" data-tab="history"><span>↺</span>Historique</button></div></nav>
<div id="editorModal" class="modal"><div class="sheet"><div class="head"><h2 id="etitle">Nouvel entraînement</h2><button class="close" onclick="closeEditor()">×</button></div><label>Nom</label><input id="wname" placeholder="Ex. Full Body A"><div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px"><h3>Exercices</h3><button class="secondary" onclick="addEx()">＋ Exercice</button></div><div id="exlist"></div><button class="primary" style="margin-top:12px" onclick="saveWorkout()">Enregistrer</button></div></div>
<div id="confirm" class="confirm"><div class="cc"><h3>Supprimer cet entraînement ?</h3><p id="ct"></p><div class="ca"><button class="secondary" onclick="closeConfirm()">Annuler</button><button class="primary danger" onclick="delWorkout()">Supprimer</button></div></div></div>
<div id="runner" class="runner"><div class="rin"><div class="rtop"><button class="secondary" onclick="quitRunner()">Quitter</button><span class="muted" id="prog"></span></div><div class="bar"><i id="bar"></i></div><div class="rmain"><div class="phase" id="phase"></div><h2 id="rname"></h2><div id="rvalue" class="value"></div><div class="detail" id="rdetail"></div><div class="hint" id="hint"></div></div><div id="controls" class="controls"></div></div></div><div id="toast" class="toast"></div>
<script>
const KEY='forma_v3_data';let data=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('forma_v2_data')||'null')||{workouts:[],history:[]};data.workouts=(data.workouts||[]).map(w=>({...w,exercises:(w.exercises||[]).map(e=>({...e,type:e.type||'time',value:e.value||e.seconds||30,sets:e.sets||1,rest:e.rest||0}))}));let editId=null,deleteId=null,R=null,timer=null,running=false,remaining=0;const $=x=>document.getElementById(x);function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function persist(){localStorage.setItem(KEY,JSON.stringify(data));render()}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1600)}function tab(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===id))}document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>tab(x.dataset.tab));
function render(){$('date').textContent=new Intl.DateTimeFormat('fr-FR',{weekday:'short',day:'numeric',month:'short'}).format(new Date());$('done').textContent=data.history.length;$('mins').textContent=Math.round(data.history.reduce((a,h)=>a+(h.minutes||0),0));$('hero').textContent=data.workouts.length?'Tes entraînements sont prêts.':'Crée ton premier entraînement.';let l=$('list');l.innerHTML='';if(!data.workouts.length)l.innerHTML='<div class="empty">Aucun entraînement.<br>Appuie sur ＋ pour créer le tien.</div>';data.workouts.forEach(w=>{let d=document.createElement('div');d.className='row';d.innerHTML='<div class="rowmain"><div class="info"><b>'+esc(w.name)+'</b><span>'+w.exercises.length+' exercice'+(w.exercises.length>1?'s':'')+'</span></div><div class="actions"><button class="mini" onclick="start(\''+w.id+'\')">▶</button><button class="mini" onclick="editor(\''+w.id+'\')">Modifier</button><button class="mini danger" onclick="askDelete(\''+w.id+'\')">Supprimer</button></div></div>';l.appendChild(d)});let h=$('hist');h.innerHTML='';if(!data.history.length)h.innerHTML='<div class="empty">Tes séances terminées apparaîtront ici.</div>';data.history.slice().reverse().forEach(x=>{let d=document.createElement('div');d.className='row';d.innerHTML='<div class="rowmain"><div class="info"><b>'+esc(x.name)+'</b><span>'+new Date(x.date).toLocaleDateString('fr-FR')+' · '+x.minutes+' min</span></div><b>✓</b></div>';h.appendChild(d)})}
function editor(id=null){editId=id;let w=id?data.workouts.find(x=>x.id===id):null;$('etitle').textContent=w?'Modifier l’entraînement':'Nouvel entraînement';$('wname').value=w?.name||'';$('exlist').innerHTML='';(w?.exercises||[{name:'',type:'reps',sets:3,value:10,rest:30}]).forEach(addEx);$('editorModal').classList.add('open')}function closeEditor(){$('editorModal').classList.remove('open')}function addEx(e={name:'',type:'reps',sets:3,value:10,rest:30}){let d=document.createElement('div');d.className='ex';d.dataset.type=e.type||'reps';d.innerHTML='<div class="extop"><input class="en" placeholder="Nom de l’exercice" value="'+esc(e.name)+'"><button class="mini danger" onclick="this.closest(\'.ex\').remove()">Suppr.</button></div><label>Type</label><div class="types"><button type="button" class="type '+(d.dataset.type==='reps'?'on':'')+'" onclick="setType(this,\'reps\')">Répétitions</button><button type="button" class="type '+(d.dataset.type==='time'?'on':'')+'" onclick="setType(this,\'time\')">Temps</button></div><div class="fields"><div><label>Séries</label><input class="es" type="number" min="1" value="'+(e.sets||1)+'"></div><div><label class="vl">'+(d.dataset.type==='reps'?'Répétitions / série':'Durée (sec)')+'</label><input class="ev" type="number" min="1" value="'+(e.value||30)+'"></div><div><label>Repos (sec)</label><input class="er" type="number" min="0" value="'+(e.rest||0)+'"></div></div>';$('exlist').appendChild(d)}function setType(b,t){let d=b.closest('.ex');d.dataset.type=t;d.querySelectorAll('.type').forEach(x=>x.classList.remove('on'));b.classList.add('on');d.querySelector('.vl').textContent=t==='reps'?'Répétitions / série':'Durée (sec)'}function saveWorkout(){let name=$('wname').value.trim()||'Entraînement',ex=[...document.querySelectorAll('.ex')].map(d=>({name:d.querySelector('.en').value.trim()||'Exercice',type:d.dataset.type,sets:Math.max(1,+d.querySelector('.es').value||1),value:Math.max(1,+d.querySelector('.ev').value||1),rest:Math.max(0,+d.querySelector('.er').value||0)}));if(!ex.length){toast('Ajoute au moins un exercice');return}if(editId){let w=data.workouts.find(x=>x.id===editId);w.name=name;w.exercises=ex}else data.workouts.push({id:uid(),name,exercises:ex});persist();closeEditor();tab('workouts');toast('Entraînement enregistré')}function askDelete(id){deleteId=id;let w=data.workouts.find(x=>x.id===id);$('ct').textContent='« '+w.name+' » sera supprimé définitivement.';$('confirm').classList.add('open')}function closeConfirm(){$('confirm').classList.remove('open');deleteId=null}function delWorkout(){if(deleteId){data.workouts=data.workouts.filter(w=>w.id!==deleteId);persist();toast('Entraînement supprimé')}closeConfirm()}
function steps(w){let a=[];w.exercises.forEach((e,ei)=>{for(let s=1;s<=e.sets;s++){a.push({type:e.type,name:e.name,value:e.value,detail:'Série '+s+' / '+e.sets});if(e.rest>0&&!(ei===w.exercises.length-1&&s===e.sets))a.push({type:'rest',name:'Repos',value:e.rest,detail:'Récupère et prépare la suite'})}});return a}function start(id){let w=data.workouts.find(x=>x.id===id);R={w,ss:steps(w),i:0,started:Date.now()};$('runner').classList.add('open');load(true);toast('C’est parti 💪')}function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.floor(n%60)).padStart(2,'0')}function load(auto){clearInterval(timer);running=false;let s=R.ss[R.i];remaining=s.value;$('prog').textContent=(R.i+1)+' / '+R.ss.length;$('bar').style.width=(R.i/R.ss.length*100)+'%';$('phase').textContent=s.type==='rest'?'REPOS':s.type==='reps'?'RÉPÉTITIONS':'CHRONO';$('rname').textContent=s.name;$('rdetail').textContent=s.type==='reps'?s.value+' répétitions · '+s.detail:s.detail;$('hint').textContent=s.type==='reps'?'Fais la série puis appuie sur « Série terminée ». Le repos suivant démarre seul.':s.type==='rest'?'Repos automatique. Tu peux passer si tu es prêt.':'Chrono automatique : à zéro, le repos puis la suite démarrent seuls.';let v=$('rvalue');v.className=s.type==='reps'?'rep':'value';v.textContent=s.type==='reps'?s.value:fmt(remaining);controls(s);if(auto&&s.type!=='reps')runTimer()}function controls(s){let c=$('controls');if(s.type==='reps')c.innerHTML='<button onclick="prev()">←</button><button class="main" onclick="doneReps()">Série terminée ✓</button><button onclick="next()">→</button>';else c.innerHTML='<button onclick="prev()">←</button><button class="main" id="tb" onclick="toggle()">Démarrer</button><button onclick="next()">Passer →</button>'}function runTimer(){if(running)return;running=true;let b=$('tb');if(b)b.textContent='Pause';timer=setInterval(()=>{remaining--;let v=$('rvalue');v.textContent=fmt(Math.max(0,remaining));if(remaining<=0){clearInterval(timer);running=false;if(navigator.vibrate)navigator.vibrate([120,60,120]);advance()}},1000)}function toggle(){if(running){clearInterval(timer);running=false;$('tb').textContent='Reprendre'}else runTimer()}function doneReps(){advance()}function advance(){if(R.i<R.ss.length-1){R.i++;load(true)}else finish()}function next(){advance()}function prev(){if(R.i>0){R.i--;load(false)}}function finish(){clearInterval(timer);data.history.push({id:uid(),name:R.w.name,date:new Date().toISOString(),minutes:Math.max(1,Math.round((Date.now()-R.started)/60000))});persist();$('runner').classList.remove('open');tab('history');toast('Séance terminée 🎉')}function quitRunner(){clearInterval(timer);running=false;$('runner').classList.remove('open');R=null}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
