<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090c"><link rel="manifest" href="manifest.webmanifest"><title>Forma</title>
<style>
:root{--bg:#08090c;--card:#15171c;--card2:#1d2027;--text:#f7f7f8;--muted:#9ca1ad;--line:#292d35}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:90px}header{padding:24px 20px 12px;display:flex;justify-content:space-between;align-items:center}h1{font-size:30px;margin:0;font-weight:750;letter-spacing:-.8px}h2{font-size:22px;margin:8px 0 14px}.muted{color:var(--muted)}button,input{font:inherit}button{border:0;color:inherit;cursor:pointer}.screen{display:none;padding:8px 18px}.screen.active{display:block}.hero{background:linear-gradient(145deg,#1a1d24,#101217);border:1px solid var(--line);border-radius:26px;padding:22px;margin:10px 0 18px}.hero .eyebrow{color:var(--muted);font-size:13px}.hero strong{display:block;font-size:27px;margin:6px 0 18px}.primary{width:100%;background:#f5f5f6;color:#08090c;padding:15px 18px;border-radius:16px;font-weight:700}.secondary{background:var(--card2);padding:12px 15px;border-radius:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:var(--card);border:1px solid var(--line);padding:17px;border-radius:18px}.stat b{font-size:25px;display:block}.stat span{font-size:12px;color:var(--muted)}.list{display:flex;flex-direction:column;gap:10px}.row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px}.row .info{min-width:0}.row .info b{display:block;font-size:16px}.row .info span{display:block;color:var(--muted);font-size:13px;margin-top:4px}.empty{padding:35px 15px;text-align:center;color:var(--muted);background:var(--card);border-radius:20px;border:1px dashed var(--line)}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(8,9,12,.92);backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:10}.bottom-inner{width:100%;max-width:560px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.tab{background:none;padding:13px 5px 11px;color:var(--muted);font-size:12px}.tab.active{color:#fff}.tab span{display:block;font-size:20px;margin-bottom:3px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:flex-end;z-index:20}.modal.open{display:flex}.sheet{width:100%;max-width:560px;margin:auto 0 0;background:#111318;border-radius:28px 28px 0 0;max-height:92vh;overflow:auto;padding:20px}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.close{background:var(--card2);width:36px;height:36px;border-radius:50%}label{display:block;color:var(--muted);font-size:13px;margin:13px 0 7px}input{width:100%;background:var(--card);color:#fff;border:1px solid var(--line);padding:13px;border-radius:13px;outline:none}.exercise-edit{border:1px solid var(--line);background:var(--card);border-radius:17px;padding:13px;margin:10px 0}.exercise-edit-top{display:flex;gap:8px}.exercise-edit input{margin-bottom:8px}.mini{padding:9px 11px;border-radius:11px;background:var(--card2);font-size:13px}.runner{position:fixed;inset:0;background:#08090c;z-index:30;display:none}.runner.open{display:block}.runner-inner{height:100%;max-width:560px;margin:auto;display:flex;flex-direction:column;padding:22px 20px calc(25px + env(safe-area-inset-bottom))}.runner-top{display:flex;justify-content:space-between;color:var(--muted)}.runner-main{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}.runner-main .label{color:var(--muted);font-size:14px}.runner-main h2{font-size:38px;margin:8px 0 20px}.timer{font-variant-numeric:tabular-nums;font-size:88px;font-weight:800;letter-spacing:-4px}.runner-main .detail{font-size:18px;color:var(--muted);margin-top:10px}.runner-controls{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:10px}.runner-controls button{padding:17px;border-radius:17px;background:var(--card2)}.runner-controls .mainctl{background:#f5f5f6;color:#08090c;font-weight:750}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#f5f5f6;color:#08090c;padding:11px 15px;border-radius:14px;font-weight:650;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1}
</style></head><body><div class="app"><header><h1>Forma</h1><div class="muted" id="dateLabel"></div></header>
<section id="home" class="screen active"><div class="hero"><div class="eyebrow">PRÊT À BOUGER ?</div><strong id="heroTitle">Crée ton premier entraînement.</strong><button class="primary" onclick="openEditor()">＋ Créer un entraînement</button></div><h2>Cette semaine</h2><div class="grid"><div class="stat"><b id="countWorkouts">0</b><span>séances</span></div><div class="stat"><b id="totalMinutes">0</b><span>minutes</span></div></div></section>
<section id="workouts" class="screen"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Mes entraînements</h2><button class="secondary" onclick="openEditor()">＋</button></div><div id="workoutList" class="list"></div></section>
<section id="history" class="screen"><h2>Historique</h2><div id="historyList" class="list"></div></section></div>
<nav class="bottom"><div class="bottom-inner"><button class="tab active" data-tab="home"><span>⌂</span>Accueil</button><button class="tab" data-tab="workouts"><span>◉</span>Entraînements</button><button class="tab" data-tab="history"><span>↺</span>Historique</button></div></nav>
<div id="editor" class="modal"><div class="sheet"><div class="sheet-head"><h2 id="editorTitle">Nouvel entraînement</h2><button class="close" onclick="closeEditor()">×</button></div><label>Nom</label><input id="workoutName" placeholder="Ex. Full Body A"><div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px"><h3>Exercices</h3><button class="secondary" onclick="addExercise()">＋ Exercice</button></div><div id="exerciseEdits"></div><button class="primary" style="margin-top:12px" onclick="saveWorkout()">Enregistrer</button></div></div>
<div id="runner" class="runner"><div class="runner-inner"><div class="runner-top"><button class="secondary" onclick="closeRunner()">Quitter</button><span id="runnerProgress">1 / 1</span></div><div class="runner-main"><div class="label" id="runnerPhase">EXERCICE</div><h2 id="runnerExercise">—</h2><div class="timer" id="runnerTimer">00:30</div><div class="detail" id="runnerDetail">—</div></div><div class="runner-controls"><button onclick="previousStep()">←</button><button class="mainctl" id="playBtn" onclick="toggleTimer()">Démarrer</button><button onclick="nextStep()">→</button></div></div></div><div id="toast" class="toast"></div>
<script>
const KEY='forma_v2_data';let data=JSON.parse(localStorage.getItem(KEY)||'null')||{workouts:[],history:[]};let editingId=null,runner=null,timer=null,remaining=0,running=false;const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}function showTab(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===id))}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
function render(){$('dateLabel').textContent=new Intl.DateTimeFormat('fr-FR',{weekday:'short',day:'numeric',month:'short'}).format(new Date());$('countWorkouts').textContent=data.history.length;$('totalMinutes').textContent=Math.round(data.history.reduce((a,h)=>a+(h.minutes||0),0));$('heroTitle').textContent=data.workouts.length?'Tes entraînements sont prêts.':'Crée ton premier entraînement.';const list=$('workoutList');list.innerHTML='';if(!data.workouts.length)list.innerHTML='<div class="empty">Aucun entraînement.<br>Appuie sur ＋ pour créer le tien.</div>';data.workouts.forEach(w=>{const d=document.createElement('div');d.className='row';d.innerHTML='<div class="info"><b>'+esc(w.name)+'</b><span>'+w.exercises.length+' exercice'+(w.exercises.length>1?'s':'')+'</span></div><button class="secondary" onclick="startWorkout(\''+w.id+'\')">Démarrer</button>';list.appendChild(d)});const hist=$('historyList');hist.innerHTML='';if(!data.history.length)hist.innerHTML='<div class="empty">Tes séances terminées apparaîtront ici.</div>';data.history.slice().reverse().forEach(h=>{const d=document.createElement('div');d.className='row';d.innerHTML='<div class="info"><b>'+esc(h.name)+'</b><span>'+new Date(h.date).toLocaleDateString('fr-FR')+' · '+h.minutes+' min</span></div><span>✓</span>';hist.appendChild(d)})}
function openEditor(){editingId=null;$('editorTitle').textContent='Nouvel entraînement';$('workoutName').value='';$('exerciseEdits').innerHTML='';addExercise();$('editor').classList.add('open')}function closeEditor(){$('editor').classList.remove('open')}function addExercise(e={name:'',sets:3,seconds:30,rest:30}){const d=document.createElement('div');d.className='exercise-edit';d.innerHTML='<div class="exercise-edit-top"><input class="ex-name" placeholder="Nom de l’exercice" value="'+esc(e.name)+'"><button class="mini" onclick="this.closest(\'.exercise-edit\').remove()">Suppr.</button></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"><div><label>Séries</label><input class="ex-sets" type="number" min="1" value="'+e.sets+'"></div><div><label>Durée (sec)</label><input class="ex-sec" type="number" min="5" value="'+e.seconds+'"></div><div><label>Repos (sec)</label><input class="ex-rest" type="number" min="0" value="'+e.rest+'"></div></div>';$('exerciseEdits').appendChild(d)}function saveWorkout(){const name=$('workoutName').value.trim()||'Entraînement';const exercises=[...document.querySelectorAll('.exercise-edit')].map(d=>({name:d.querySelector('.ex-name').value.trim()||'Exercice',sets:Math.max(1,+d.querySelector('.ex-sets').value||1),seconds:Math.max(5,+d.querySelector('.ex-sec').value||30),rest:Math.max(0,+d.querySelector('.ex-rest').value||0)}));if(!exercises.length){toast('Ajoute au moins un exercice');return}data.workouts.push({id:uid(),name,exercises});save();closeEditor();showTab('workouts');toast('Entraînement enregistré')}
function buildSteps(w){const steps=[];w.exercises.forEach((e,ei)=>{for(let s=1;s<=e.sets;s++){steps.push({type:'exercise',name:e.name,seconds:e.seconds,detail:'Série '+s+' / '+e.sets});if(e.rest>0&&!(ei===w.exercises.length-1&&s===e.sets))steps.push({type:'rest',name:'Repos',seconds:e.rest,detail:'Respire et prépare la suite'})}});return steps}function startWorkout(id){const w=data.workouts.find(x=>x.id===id);if(!w)return;runner={workout:w,steps:buildSteps(w),idx:0,started:Date.now()};$('runner').classList.add('open');loadStep();toast('Bonne séance 💪')}function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.floor(n%60)).padStart(2,'0')}function loadStep(){clearInterval(timer);running=false;const s=runner.steps[runner.idx];remaining=s.seconds;$('runnerProgress').textContent=(runner.idx+1)+' / '+runner.steps.length;$('runnerPhase').textContent=s.type==='rest'?'REPOS':'EXERCICE';$('runnerExercise').textContent=s.name;$('runnerTimer').textContent=fmt(remaining);$('runnerDetail').textContent=s.detail;$('playBtn').textContent='Démarrer'}function toggleTimer(){if(running){clearInterval(timer);running=false;$('playBtn').textContent='Reprendre';return}running=true;$('playBtn').textContent='Pause';timer=setInterval(()=>{remaining--;$('runnerTimer').textContent=fmt(Math.max(0,remaining));if(remaining<=0){clearInterval(timer);running=false;if(navigator.vibrate)navigator.vibrate([120,60,120]);if(runner.idx<runner.steps.length-1){runner.idx++;loadStep();toast('Étape suivante')}else finishWorkout()}},1000)}function nextStep(){if(runner.idx<runner.steps.length-1){runner.idx++;loadStep()}else finishWorkout()}function previousStep(){if(runner.idx>0){runner.idx--;loadStep()}}function finishWorkout(){clearInterval(timer);running=false;data.history.push({id:uid(),name:runner.workout.name,date:new Date().toISOString(),minutes:Math.max(1,Math.round((Date.now()-runner.started)/60000))});save();$('runner').classList.remove('open');showTab('history');toast('Séance terminée 🎉')}function closeRunner(){clearInterval(timer);running=false;$('runner').classList.remove('open');runner=null}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
