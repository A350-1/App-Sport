<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7"><link rel="manifest" href="manifest.webmanifest">
<title>Forma</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
.app{max-width:680px;margin:auto;min-height:100vh;padding:20px 18px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.logo{font-size:28px;font-weight:750;letter-spacing:-1px}.muted{color:#777;font-size:13px}
.card{background:white;border-radius:24px;padding:20px;margin:12px 0;box-shadow:0 8px 30px #0000000b}.hero{background:#111;color:white;padding:25px}.hero h1{font-size:34px;line-height:1;margin:8px 0 15px;letter-spacing:-1.5px}.btn{border:0;border-radius:15px;padding:14px 17px;font-weight:650;font-size:15px;background:#111;color:white}.hero .btn{background:white;color:#111}.full{width:100%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:15px;background:white;border-radius:19px}.stat b{font-size:24px}.stat span{display:block;color:#777;font-size:12px;margin-top:4px}.head{display:flex;justify-content:space-between;align-items:center;margin:25px 2px 10px}.row{display:flex;gap:13px;align-items:center}.circle{width:44px;height:44px;border-radius:15px;background:#eee;display:grid;place-items:center;font-weight:700}.grow{flex:1}.small{font-size:13px;color:#777;margin-top:3px}.nav{position:fixed;bottom:0;left:0;right:0;padding:10px 18px calc(10px + env(safe-area-inset-bottom));background:#f5f5f7ee;backdrop-filter:blur(18px);z-index:5}.navin{max-width:680px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.nav button{border:0;background:white;border-radius:15px;padding:9px;color:#777}.nav button.on{color:#111;box-shadow:0 5px 20px #0001}.screen{display:none}.screen.on{display:block}.modal{position:fixed;inset:0;background:#f5f5f7;z-index:10;padding:25px 18px;overflow:auto}.hidden{display:none}.input{width:100%;padding:14px;border:1px solid #ddd;border-radius:14px;background:white;margin:7px 0 12px;font-size:16px}.ex{padding:14px;border:1px solid #e5e5e5;border-radius:18px;margin:10px 0}.timer{font-size:76px;font-weight:750;letter-spacing:-5px;text-align:center;margin:35px 0}.run{position:fixed;inset:0;background:#f5f5f7;z-index:20;padding:25px 20px calc(25px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.runmain{text-align:center;margin-top:12vh}.bar{height:5px;background:#ddd;border-radius:5px}.bar i{display:block;height:100%;background:#111;width:0;border-radius:5px}.runbuttons{margin-top:auto;display:grid;gap:10px}.ghost{background:white;color:#111}.danger{color:#e33}
</style></head><body>
<div id="app" class="app">
<div class="top"><div><div class="logo">Forma</div><div class="muted" id="date"></div></div><button class="btn" onclick="newW()">＋</button></div>
<div id="home" class="screen on">
<div class="card hero"><div class="muted" style="color:#aaa">AUJOURD'HUI</div><h1 id="hero">Crée ta première séance</h1><div id="meta" style="opacity:.7;margin-bottom:18px">Forma guidera ensuite chaque étape.</div><button class="btn" onclick="newW()">Créer une séance</button></div>
<div class="grid"><div class="stat"><b id="s1">0</b><span>Séances</span></div><div class="stat"><b id="s2">0</b><span>Minutes</span></div><div class="stat"><b id="s3">0</b><span>Reps</span></div></div>
<div class="head"><h2>Mes séances</h2></div><div id="homeList"></div>
</div>
<div id="workouts" class="screen"><div class="head"><h2>Entraînements</h2></div><div id="list"></div></div>
<div id="history" class="screen"><div class="head"><h2>Historique</h2></div><div id="hist"></div></div>
</div>
<div class="nav"><div class="navin"><button class="on" onclick="tab('home',this)">⌂<br><small>Accueil</small></button><button onclick="tab('workouts',this)">◉<br><small>Séances</small></button><button onclick="tab('history',this)">◷<br><small>Historique</small></button></div></div>

<div id="editor" class="modal hidden"><div class="top"><b>Nouvelle séance</b><button class="btn ghost" onclick="closeEdit()">×</button></div>
<label class="muted">Nom</label><input id="name" class="input" placeholder="Ex. Pectoraux + abdos">
<div class="head"><h3>Exercices</h3><button class="btn" onclick="addEx()">＋</button></div><div id="exs"></div>
<button class="btn full" onclick="saveW()">Enregistrer</button></div>

<div id="runner" class="run hidden"><div class="top"><b id="rn"></b><button class="btn ghost" onclick="quit()">×</button></div>
<div class="runmain"><div class="muted" id="rtype">EXERCICE</div><h1 id="rex">—</h1><div class="timer" id="rt">00:00</div><div class="bar"><i id="rp"></i></div><p class="muted" id="tip"></p></div>
<div class="runbuttons"><button class="btn ghost" id="pause" onclick="pause()">Pause</button><button class="btn" onclick="next()">Suivant</button></div></div>

<script>
const K='forma_pwa';let d=JSON.parse(localStorage.getItem(K)||'null')||{w:[],h:[]},run=null,interval=null,paused=false;
const $=x=>document.getElementById(x); const esc=x=>String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function persist(){localStorage.setItem(K,JSON.stringify(d));render()}
function tab(id,b){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render()}
function newW(){$('name').value='';$('exs').innerHTML='';addEx();$('editor').classList.remove('hidden')}
function closeEdit(){$('editor').classList.add('hidden')}
function addEx(){let x=document.createElement('div');x.className='ex';x.innerHTML='<input class="input en" placeholder="Nom de l’exercice"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input class="input se" type="number" value="3" placeholder="Séries"><input class="input re" type="number" value="12" placeholder="Reps"></div><input class="input rs" type="number" value="60" placeholder="Repos en secondes">';$('exs').appendChild(x)}
function saveW(){let w={id:Date.now(),name:$('name').value.trim()||'Ma séance',e:[...document.querySelectorAll('.ex')].map(x=>({n:x.querySelector('.en').value||'Exercice',s:+x.querySelector('.se').value||1,r:+x.querySelector('.re').value||1,rest:+x.querySelector('.rs').value||0}));d.w.push(w);closeEdit();persist();tab('workouts',document.querySelectorAll('.nav button')[1])}
function start(id){let w=d.w.find(x=>x.id==id);run={w,steps:[],i:0,sec:0,reps:0};w.e.forEach(e=>{for(let s=1;s<=e.s;s++){run.steps.push({kind:'ex',n:e.n,r:e.r});if(e.rest&&!(s==e.s&&e===w.e[w.e.length-1]))run.steps.push({kind:'rest',n:'Repos',r:e.rest})}});$('runner').classList.remove('hidden');load()}
function load(){clearInterval(interval);if(run.i>=run.steps.length)return finish();let s=run.steps[run.i];run.left=s.r;paused=false;$('rn').textContent=run.w.name;$('rex').textContent=s.n;$('rtype').textContent=s.kind==='rest'?'RÉCUPÉRATION':'SÉRIE';$('tip').textContent=s.kind==='rest'?'Respire, bois un peu d’eau et prépare la suite.':'Mouvement contrôlé, amplitude régulière.';$('pause').textContent='Pause';tick();interval=setInterval(()=>{if(!paused){run.left--;run.sec++;tick();if(run.left<=0)next()}},1000)}
function tick(){$('rt').textContent='00:'+String(Math.max(0,run.left)).padStart(2,'0');$('rp').style.width=(100*(1-run.left/run.steps[run.i].r))+'%'}
function pause(){paused=!paused;$('pause').textContent=paused?'Reprendre':'Pause'}
function next(){let s=run.steps[run.i];if(s.kind==='ex')run.reps+=s.r;run.i++;load()}
function finish(){clearInterval(interval);d.h.push({name:run.w.name,date:Date.now(),sec:run.sec,reps:run.reps});$('runner').classList.add('hidden');persist()}
function quit(){clearInterval(interval);$('runner').classList.add('hidden');run=null}
function render(){let total=d.h.reduce((a,x)=>a+x.sec,0),reps=d.h.reduce((a,x)=>a+x.reps,0);$('date').textContent=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(new Date());$('s1').textContent=d.h.length;$('s2').textContent=Math.round(total/60);$('s3').textContent=reps;$('homeList').innerHTML=d.w.slice(0,3).map(card).join('')||'<div class="card muted">Aucune séance.</div>';$('list').innerHTML=d.w.map(card).join('')||'<div class="card muted">Crée ta première séance.</div>';$('hist').innerHTML=d.h.slice().reverse().map(x=>'<div class="card"><b>'+esc(x.name)+'</b><div class="small">'+new Date(x.date).toLocaleString('fr-FR')+' · '+Math.round(x.sec/60)+' min · '+x.reps+' reps</div></div>').join('')||'<div class="card muted">Aucun historique.</div>';if(d.w.length){$('hero').textContent=d.w[0].name;$('meta').textContent=d.w[0].e.length+' exercices · appuie pour commencer'}else{$('hero').textContent='Crée ta première séance'}}
function card(w){return '<div class="card"><div class="row"><div class="circle">'+w.e.length+'</div><div class="grow"><b>'+esc(w.name)+'</b><div class="small">'+w.e.length+' exercices</div></div></div><button class="btn full" style="margin-top:14px" onclick="start('+w.id+')">Commencer</button></div>'}
render();
</script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script>
</body></html>
